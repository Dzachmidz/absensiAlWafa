<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak ID Card - {{ siswa.nama }}</title>

    <!-- Pake LINK agar proses load font lebih stabil saat diprint -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">

    <style>
        /* Reset bawaan untuk printing yang bersih */
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: row; /* Menyusun kartu secara horizontal menyamping */
            flex-wrap: wrap; /* Baris otomatis turun jika dikanan sudah penuh */
            justify-content: center;
            align-items: flex-start;
            background-color: #555; /* Warna background browser sebelum print */
            font-family: 'Arial', sans-serif;
            gap: 20px; /* Jarak antar set kartu saat preview di browser */
        }

        /* Ukuran standar Box ID Card (CR-80 Mifare: 54mm x 85.6mm) */
        .id-card-wrapper {
            position: relative;
            width: 54mm;
            height: 85.6mm;
            background-color: #fff;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 3.18mm;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* FOTO SISWA */
        .foto-siswa {
            position: absolute;
            top: 33.1%; /* Jarak bingkai foto dari tepi atas, mainkan angka ini (contoh: 30%) */
            left: 22.7%;  /* Jarak bingkai foto dari tepi kiri */
            width: 29.3mm; /* Lebar kotak foto */
            height: 32.7mm; /* Tinggi kotak foto */
            border-radius: 3mm; /* Sesuaikan kelengkungan bingkai polos di desain */
            object-fit: cover; /* Mencegah foto melar/gepeng */
            object-position: bottom center;
            z-index: 1;
        }

        /* FOTO SISWA KHUSUS JENJANG KB & TK */
        .foto-kb-tk {
            top: 37%; /* Jarak bingkai foto dari tepi atas, mainkan angka ini (contoh: 30%) */
            left: 22.7%;  /* Jarak bingkai foto dari tepi kiri */
            width: 29.3mm; /* Lebar kotak foto */
            height: 29.4mm; /* Ganti ukuran tingginya */
        }

        /* FOTO SISWA KHUSUS JENJANG TPQ & MADIN */
        .foto-tpq-madin {
            top: 34%; /* Silakan edit posisi top foto untuk TPQ & MADIN */
            left: 29.7%;  /* Silakan edit posisi left foto untuk TPQ & MADIN */
            width: 29mm; /* Silakan edit lebar foto untuk TPQ & MADIN */
            height: 32.5mm; /* Silakan edit tinggi foto untuk TPQ & MADIN */
        }

        /* TULISAN NAMA (DEFAULT: 1 BARIS / PENDEK) */
        .nama-siswa {
            position: absolute;
            top: 75.8%; /* Agak ke bawah karena hanya 1 baris */
            left: 0%;
            width: 100%;
            text-align: center;
            font-family: 'Mochiy Pop P One', sans-serif; /* Font yang lebih tebal dan modern untuk nama */ 
            font-size: 8pt; /* Ukuran huruf proporsional dengan mm */
            font-weight: 800;
            color: #facf5a; /* Warna Emas Khas Al Wafa */
            text-transform: uppercase;
            /* text-shadow: 1px 1px 2px rgba(0,0,0,0.3); */
            padding: 0 5mm;
            box-sizing: border-box;
            line-height: 1.1;
            z-index: 2;
        }

        /* TULISAN NAMA (KHUSUS NAMA PANJANG / 2 BARIS) */
        .nama-siswa.nama-panjang {
            top: 74.5%; /* Agak dinaikkan supaya baris keduanya tidak menabrak kotak kelas */
            font-size: 7.5pt; /* Dikecilkan sedikit dari default */
            padding: 0 8mm; /* BATAS KANAN-KIRI DITEKAN AGAR NAMA OTOMATIS TURUN (WRAP) */
            line-height: 1.2;
            word-wrap: break-word;
            white-space: normal;
        }

        /* TULISAN NAMA (SANGAT PANJANG / 3 BARIS) */
        .nama-siswa.nama-super-panjang {
            top: 72.5%; /* Lebih dinaikkan lagi agar baris ketiganya tidak nabrak kelas */
            font-size: 7.5pt; /* Hurufnya lebih dikecilkan lagi */
            padding: 0 9mm; /* LEBIH DITEKAN LAGI KANAN-KIRINYA */
            line-height: 1.2;
            word-wrap: break-word;
            white-space: normal;
        }

        /* TULISAN KELAS / AL-PHARABIUS */
        .kelas-siswa {
            position: absolute;
            top: 85%; /* Jarak Teks Kelas dari atas */
            left: 0%;
            width: 100%;
            text-align: center;
            font-family: 'Mochiy Pop P One', sans-serif;
            font-size: 6pt; /* Ukuran huruf proporsional dengan mm */
            font-weight: bold;
            color: #facf5a; /* Warna Emas */
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;

            /* GARIS BANTU NAMA: Agar tahu ukuran kotaknya */
            /* background-color: rgba(255, 0, 0, 0.3); */
            /* border: 1px dashed red; */
        }

        /* NAMA KHUSUS JENJANG TPQ & MADIN */
        .nama-tpq-madin {
            top: 76%; /* Silakan edit posisi nama atas untuk TPQ & MADIN */
            left: 7%; /* Silakan edit posisi left nama untuk TPQ & MADIN */
        }
        .nama-tpq-madin.nama-panjang {
            top: 74.5%; /* Silakan edit cover baris 2 */
            left: 7%; /* Silakan edit posisi left nama untuk TPQ & MADIN */
        }
        .nama-tpq-madin.nama-super-panjang {
            top: 75%; /* Silakan edit cover baris 3 */
            left: 7%; /* Silakan edit posisi left nama untuk TPQ & MADIN */
        }

        /* KELAS KHUSUS JENJANG TPQ & MADIN */
        .kelas-tpq-madin {
            top: 83.5%; /* Silakan edit posisi kelas untuk TPQ & MADIN */
            left: 7%; /* Silakan edit posisi left kelas untuk TPQ & MADIN */
        }

        /* KARTU BAGIAN BELAKANG (CR-80 Mifare: 54mm x 85.6mm) */
        .id-card-back {
            position: relative;
            width: 54mm;
            height: 85.6mm;
            background-color: #fff;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 3.18mm;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* CONTAINER UNTUK MENJAJEJARKAN DEPAN & BELAKANG */
        .kartu-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: flex-start;
            justify-content: center;
        }

        /* Mode Cetak: 1 Halaman PDF = 1 Sisi Kartu Pas Standar CR-80 (54mm x 85.6mm) */
        @media print {
            @page {
                size: 54mm 85.6mm;
                margin: 0;
            }
            html, body {
                width: 54mm;
                height: 85.6mm;
                margin: 0 !important;
                padding: 0 !important;
                background-color: transparent !important;
            }
            body {
                display: block !important;
            }
            .kartu-container {
                display: block !important;
                margin: 0 !important;
                padding: 0 !important;
                gap: 0 !important;
            }
            .id-card-wrapper, .id-card-back {
                width: 54mm !important;
                height: 85.6mm !important;
                max-width: 54mm !important;
                max-height: 85.6mm !important;
                margin: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                page-break-after: always !important;
                break-after: page !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            .id-card-back {
                page-break-after: auto !important;
                break-after: auto !important;
            }
        }

        /* Menampilkan tombol "Print Semua" di mode browser, disembunyikan saat di print */
        .print-btn-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #4CAF50;
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            text-decoration: none;
            z-index: 1000;
        }
        .print-btn-float:hover {
            background-color: #45a049;
        }
        @media print {
            .print-btn-float {
                display: none;
            }
        }
    </style>
</head>
<body>
    {% load static %}

    <a href="javascript:window.print()" class="print-btn-float">🖨️ Cetak ke PDF</a>
    
    <!-- PEMBUNGKUS KEDUA KARTU (DEPAN & BELAKANG) -->
    <div class="kartu-container">

        <!-- KARTU BAGIAN DEPAN -->
        <div class="id-card-wrapper" style="background-image: url('{% if siswa.kelas %}{% if siswa.kelas.jenjang == 'KB' %}{% static 'bg_kb.png' %}{% elif siswa.kelas.jenjang == 'TK' %}{% static 'bg_tk.png' %}{% elif siswa.kelas.jenjang == 'PKBM' %}{% static 'bg_pkbm.png' %}{% elif siswa.kelas.jenjang == 'TPQ' %}{% static 'bg_tpq.png' %}{% elif siswa.kelas.jenjang == 'MADIN' %}{% static 'bg_madin.png' %}{% else %}{% static 'bg_pkbm.png' %}{% endif %}{% else %}{% static 'bg_pkbm.png' %}{% endif %}') !important;">
            
            <!-- FOTO -->
        {% if siswa.foto %}
            <img src="{{ siswa.foto.url }}" alt="Foto Siswa" class="foto-siswa {% if siswa.kelas and siswa.kelas.jenjang in 'KB,TK' %}foto-kb-tk{% elif siswa.kelas and siswa.kelas.jenjang in 'TPQ,MADIN' %}foto-tpq-madin{% endif %}">
        {% else %}
            <!-- Kalau tidak ada foto, bisa masukkan siluet default atau biarkan kosong transparan -->
            <div class="foto-siswa {% if siswa.kelas and siswa.kelas.jenjang in 'KB,TK' %}foto-kb-tk{% elif siswa.kelas and siswa.kelas.jenjang in 'TPQ,MADIN' %}foto-tpq-madin{% endif %}" style="background-color: rgba(255,255,255,0.7); display: flex; justify-content: center; align-items: center; color: #333; font-weight: bold;">
                Belum Upload Foto
            </div>
        {% endif %}
        
        <!-- NAMA -->
        <!-- Logic Django: Deteksi panjang karakter, 1 baris, 2 baris (>20), atau 3 baris (>30) otomatis -->
        <div class="nama-siswa {% if siswa.nama|length >= 30 %}nama-super-panjang{% elif siswa.nama|length >= 20 %}nama-panjang{% endif %} {% if siswa.kelas and siswa.kelas.jenjang in 'TPQ,MADIN' %}nama-tpq-madin{% endif %}">
            {{ siswa.nama }}
        </div>
        
        <!-- KELAS -->
        <div class="kelas-siswa {% if siswa.kelas and siswa.kelas.jenjang in 'TPQ,MADIN' %}kelas-tpq-madin{% endif %}">
            {% if siswa.kelas %}
                {{ siswa.kelas.nama_kelas }}
            {% else %}
                -
            {% endif %}
        </div>

        </div> <!-- Tutup id-card-wrapper (Kartu Depan) -->

        <!-- KARTU BAGIAN BELAKANG -->
        <div class="id-card-back" style="background-image: url('{% if siswa.kelas %}{% if siswa.kelas.jenjang == 'KB' %}{% static 'bg_kb_back.png' %}{% elif siswa.kelas.jenjang == 'TK' %}{% static 'bg_tk_back.png' %}{% elif siswa.kelas.jenjang == 'PKBM' %}{% static 'bg_pkbm_back.png' %}{% elif siswa.kelas.jenjang == 'TPQ' %}{% static 'bg_tpq_back.png' %}{% elif siswa.kelas.jenjang == 'MADIN' %}{% static 'bg_madin_back.png' %}{% else %}{% static 'bg_pkbm_back.png' %}{% endif %}{% else %}{% static 'bg_pkbm_back.png' %}{% endif %}') !important;">
            <!-- Isi konten belakang (misal Visi Misi, QR Code, barcode, TTD Kepsek, dsb) -->
        </div>

    </div> <!-- Tutup kartu-container -->

    <!-- SCRIPT CETAK OTOMATIS BROWSER -->
    <script>
        window.onload = function() {
            // Uncomment baris di bawah kalau mau nge-print otomatis saat link dibuka
            // window.print();
        }
    </script>
</body>
</html>
