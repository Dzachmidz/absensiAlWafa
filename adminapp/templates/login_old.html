<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - Absensi Al Wafa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100 h-screen flex items-center justify-center">
    <div
      class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm transform transition-all hover:scale-105"
    >
      <div class="text-center mb-8">
        <div
          class="bg-blue-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600 text-3xl"
        >
          <i class="fas fa-lock"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Login Admin</h1>
        <p class="text-gray-500 text-sm">Absensi Digital Al-Wafa</p>
      </div>

      {% if messages %}
      <div class="mb-4 space-y-2">
        {% for message in messages %}
        <div
          class="p-3 rounded-lg text-sm {% if message.tags == 'success' %}bg-green-100 text-green-700 border border-green-200{% else %}bg-red-100 text-red-700 border border-red-200{% endif %} flex items-center"
        >
          <i
            class="fas {% if message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %} mr-2"
          ></i>
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <form method="POST" action="">
        {% csrf_token %}
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-2"
            >Username</label
          >
          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"
            >
              <i class="fas fa-user"></i>
            </span>
            <input
              type="text"
              name="username"
              required
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
              placeholder="Masukkan username"
            />
          </div>
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-2"
            >Password</label
          >
          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"
            >
              <i class="fas fa-key"></i>
            </span>
            <input
              type="password"
              name="password"
              required
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
              placeholder="Masukkan password"
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-all shadow-lg hover:shadow-xl flex justify-center items-center"
        >
          <i class="fas fa-sign-in-alt mr-2"></i> Masuk
        </button>
      </form>

      <div class="mt-6 text-center text-xs text-gray-400">
        &copy; {% now "Y" %} Absensi Al-Wafa. All rights reserved.
      </div>
    </div>
  </body>
</html>
